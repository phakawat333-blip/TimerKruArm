<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Competition - Timer by Kru Arm</title>
    <style>
        /* รีเซ็ตค่าเริ่มต้นและตั้งฟอนต์ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #121212;
            color: #ffffff;
            transition: background-color 0.3s ease;
            position: relative;
        }

        /* โหมดเตือนภัย (เมื่อหมดเวลา) */
        body.time-up-mode {
            background-color: #3a0a0a;
        }

        /* ---------------- กราฟิกหัวข้อ Science Competition ---------------- */
        .header-graphic {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            text-align: center;
        }

        .accent-line {
            width: 80px;
            height: 4px;
            background-color: #4a90e2;
            margin-bottom: 16px;
            border-radius: 2px;
        }

        .header-graphic h1 {
            font-size: clamp(24px, 5vw, 42px);
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin: 0;
            color: #ffffff;
        }

        .header-graphic h1 span {
            color: #4a90e2;
            font-weight: 300;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #888;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitle span {
            color: #4a90e2;
            font-weight: 500;
        }

        /* ---------------- ส่วนแสดงตัวเลขหลัก ---------------- */
        .timer-display {
            font-size: 22vw;
            line-height: 1;
            font-weight: 300;
            letter-spacing: -2px;
            margin-bottom: 50px;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        body.time-up-mode .timer-display {
            color: #ff4444;
            animation: pulse-text 1s infinite alternate;
        }

        @keyframes pulse-text {
            from { opacity: 1; }
            to { opacity: 0.6; }
        }

        /* ---------------- คอนเทนเนอร์รวมปุ่มควบคุม ---------------- */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            z-index: 10;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
            gap: 12px;
        }

        button {
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #3a3a3a;
            border-color: #555;
        }

        button:active {
            transform: scale(0.98);
        }

        button.stop-btn {
            background-color: #cc0000;
            border-color: #cc0000;
            color: white;
            grid-column: 1 / -1;
        }

        button.stop-btn:hover {
            background-color: #e60000;
            border-color: #e60000;
        }

        /* ---------------- ส่วนตั้งเวลาเอง ---------------- */
        .custom-time-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="number"] {
            width: 70px;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            background-color: #2a2a2a;
            color: #ffffff;
            border: 1px solid #444;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: #4a90e2;
        }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }

        .input-label {
            font-size: 14px;
            color: #888;
        }

        button.start-custom {
            background-color: #4a90e2;
            border-color: #4a90e2;
            padding: 12px 24px;
        }

        button.start-custom:hover {
            background-color: #357abd;
            border-color: #357abd;
        }

        /* ---------------- Footer ด้านล่างสุด ---------------- */
        .footer-credit {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .footer-credit span {
            color: #888;
            font-weight: 500;
        }

        @media (max-width: 480px) {
            .custom-time-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .input-wrapper {
                justify-content: center;
            }
            .footer-credit {
                position: relative;
                margin-top: 40px;
                bottom: 0;
            }
        }
    </style>
</head>
<body>

    <!-- ไฟล์เสียงเตือน -->
    <audio id="alarmSound" src="https://assets.mixkit.co/active_storage/sfx/989/989-preview.mp3" preload="auto" loop></audio>

    <!-- กราฟิกหัวข้อโปรเจกต์ -->
    <div class="header-graphic">
        <div class="accent-line"></div>
        <h1>SCIENCE <span>COMPETITION</span></h1>
        <!-- ชื่อที่ใต้หัวข้อ -->
        <div class="subtitle">By <span>Kru Arm Phakawat Songmuang</span></div>
    </div>

    <!-- หน้าจอแสดงเวลาขนาดใหญ่ -->
    <div class="timer-display" id="display">00:00</div>

    <!-- คอนเทนเนอร์ควบคุม -->
    <div class="controls-wrapper">
        
        <!-- ปุ่มลัด -->
        <div class="quick-buttons">
            <button onclick="startTimer(30)">30 วิ</button>
            <button onclick="startTimer(45)">45 วิ</button>
            <button onclick="startTimer(60)">60 วิ</button>
            <button onclick="startTimer(90)">90 วิ</button>
            <button onclick="startTimer(120)">120 วิ</button>
            <button class="stop-btn" onclick="stopTimer()">หยุด / รีเซ็ต</button>
        </div>

        <!-- ตั้งเวลาแบบกำหนดเอง -->
        <div class="custom-time-panel">
            <div class="input-wrapper">
                <input type="number" id="customMinutes" placeholder="00" min="0">
                <span class="input-label">นาที</span>
            </div>
            <div class="input-wrapper">
                <input type="number" id="customSeconds" placeholder="00" min="0" max="59">
                <span class="input-label">วินาที</span>
            </div>
            <button class="start-custom" onclick="startCustomTime()">เริ่ม</button>
        </div>

    </div>

    <!-- เครดิตด้านล่างสุดของหน้าจอ -->
    <div class="footer-credit">
        SYSTEM DESIGNED BY <span>KRU ARM PHAKAWAT SONGMUANG</span>
    </div>

    <script>
        let countdown;
        const display = document.getElementById('display');
        const alarmSound = document.getElementById('alarmSound');
        const body = document.body;

        function startTimer(seconds) {
            clearInterval(countdown);
            stopAlarm(); 

            const now = Date.now();
            const then = now + seconds * 1000;
            
            displayTimeLeft(seconds);

            countdown = setInterval(() => {
                const secondsLeft = Math.round((then - Date.now()) / 1000);

                if (secondsLeft < 0) {
                    clearInterval(countdown);
                    triggerAlarm();
                    return;
                }

                displayTimeLeft(secondsLeft);
            }, 1000);
        }

        function displayTimeLeft(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainderSeconds = seconds % 60;
            
            const displayFormat = `${minutes < 10 ? '0' : ''}${minutes}:${remainderSeconds < 10 ? '0' : ''}${remainderSeconds}`;
            
            display.textContent = displayFormat;
            document.title = `${displayFormat} - Timer`;
        }

        function startCustomTime() {
            const mins = parseInt(document.getElementById('customMinutes').value) || 0;
            const secs = parseInt(document.getElementById('customSeconds').value) || 0;
            
            if (mins === 0 && secs === 0) return;
            
            const totalSeconds = (mins * 60) + secs;
            startTimer(totalSeconds);
            
            document.getElementById('customMinutes').value = '';
            document.getElementById('customSeconds').value = '';
        }

        function stopTimer() {
            clearInterval(countdown);
            displayTimeLeft(0);
            stopAlarm();
        }

        function triggerAlarm() {
            alarmSound.play().catch(error => console.log("Auto-play prevented by browser"));
            body.classList.add('time-up-mode');
        }

        function stopAlarm() {
            alarmSound.pause();
            alarmSound.currentTime = 0;
            body.classList.remove('time-up-mode');
        }
    </script>
</body>
</html>
